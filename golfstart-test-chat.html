<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Spørg GolfStart AI</title><style>
:root{--g1:#17381b;--g2:#245a2b;--gold:#c9a84c;--gold2:#e9c98b;--cream:#f7f4ec;--ink:#1a3d1a}
*{box-sizing:border-box}html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--cream)}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
header{flex:none;display:flex;align-items:center;gap:12px;padding:13px 14px;background:linear-gradient(155deg,var(--g2),var(--g1));color:#fff;border-bottom:3px solid var(--gold)}
.logo{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}
.logo svg{width:24px;height:24px}
.heading{flex:1;min-width:0}
h1{margin:0;font-size:18px;line-height:1.2;color:#fff}
small{display:block;margin-top:2px;font-size:12px;color:var(--gold2);letter-spacing:.3px}
.close{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);background:transparent;color:var(--gold2);font-size:24px;line-height:1;cursor:pointer}
.close:focus-visible,.chips button:focus-visible,.composer button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{flex:none;display:flex;gap:8px;overflow-x:auto;padding:10px 12px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:#efe9d8;border-bottom:1px solid #e0d6bb}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;white-space:nowrap;font:600 13px system-ui,sans-serif;color:var(--ink);background:#fffaf0;border:1.2px solid var(--gold);border-radius:20px;padding:9px 14px;cursor:pointer;min-height:38px}
.messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px 10px;display:flex;flex-direction:column;gap:14px;background:var(--cream)}
.bubble{max-width:90%;padding:13px 15px;font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:16px}
.bot{align-self:flex-start;background:#fff;border:1px solid #e3dac0;border-left:4px solid var(--gold);border-top-left-radius:6px;color:#22301f;box-shadow:0 1px 3px rgba(26,61,26,.08)}
.user{align-self:flex-end;background:linear-gradient(155deg,var(--g2),var(--g1));color:#fff;border-top-right-radius:6px}
.bubble.pending{color:#6b7a68;font-style:italic}
.sources{margin-top:10px;padding-top:8px;border-top:1px solid #eee5cc;font-size:13px;white-space:normal}
.sources a{color:#7a5d12;font-weight:600;margin-right:12px}
.note{align-self:center;font-size:12px;color:#7a7468;text-align:center;padding:0 10px}
.composer{flex:none;display:flex;gap:10px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#efe9d8;border-top:1px solid #e0d6bb}
textarea{flex:1;min-width:0;resize:none;font:16px/22px system-ui,-apple-system,sans-serif;padding:10px 12px;border:1.5px solid #c9b57a;border-radius:14px;background:#fff;color:#1c2a1a;height:64px;min-height:64px;max-height:130px;overflow-y:auto}
.composer button{flex:none;height:48px;min-width:74px;padding:0 16px;border:1.5px solid var(--gold);border-radius:14px;background:linear-gradient(155deg,var(--g2),var(--g1));color:var(--gold2);font:700 15px system-ui,sans-serif;cursor:pointer}
.composer button:disabled{opacity:.55}
.footer{flex:none;font-size:11px;padding:0 14px 8px;color:#6b7a68;background:#efe9d8;text-align:center}
.footer a{color:#7a5d12}
@media(max-height:420px){.chips{display:none}}
</style></head><body><div class="app">
<header><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#e9c98b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21V3M7 4.5l10 3.5-10 3.5"/><path d="M3.5 21h8"/><circle cx="17.5" cy="18" r="2.2"/></svg></div><div class="heading"><h1>Spørg GolfStart AI</h1><small>Lyngbygaard Golf · Din begynderhjælper</small></div><button class="close" type="button" aria-label="Luk chat" onclick="window.parent.postMessage('lyg-golfstart-close',window.location.origin)">×</button></header>
<div class="chips" aria-label="Genveje"><button type="button" data-q="Hvordan tilmelder jeg mig?">Tilmelding</button><button type="button" data-q="Jeg kan ikke deltage i alle moduler. Hvad gør jeg?">Mangler moduler</button><button type="button" data-q="Hvad er Begyndermix?">Begyndermix</button><button type="button" data-q="Kan jeg spise i Brasseriet?">Brasseriet</button><button type="button" data-q="Hvad med hold i 2027?">Hold 2027</button></div>
<div class="messages" id="messages" role="log" aria-live="polite"><div class="bubble bot">Velkommen! Spørg om begynderforløb, tilmelding, moduler, regler, GolfBox eller Brasseriet.</div><div class="note">Svar kan indeholde fejl. Kontroller altid datoer og priser hos klubben.</div></div>
<form class="composer" id="form"><textarea id="question" rows="2" maxlength="400" required placeholder="Skriv dit spørgsmål ..." aria-label="Dit spørgsmål" enterkeyhint="send"></textarea><button type="submit">Send</button></form>
<div class="footer">Ingen personlige oplysninger, tak. <a target="_blank" rel="noopener" href="https://lyg.dk/begyndergolf/">Begyndergolf</a> · <a target="_blank" rel="noopener" href="https://lyg.dk/brasseriet/">Brasseriet</a></div>
</div><script src="./golfstart-test-chat.js"></script><script>document.addEventListener('keydown',function(e){if(e.key==='Escape')window.parent.postMessage('lyg-golfstart-close',window.location.origin)})</script></body></html>
